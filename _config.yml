# 사이트 전역 설정 — 콘텐츠는 _data/ 와 _news/ 에 둔다.
title: EDM Lab
description: 한국공학대학교 신소재공학과 환경내구금속연구실(EDM Lab)
lang: ko
url: https://edm-lab.github.io
baseurl: ""

# 개발 기간에는 true. Step 6(정식 오픈)에서 사용자 승인 후 false로 바꾼다.
# robots.txt로 막지 않고 meta 태그로만 처리한다.
noindex: true

permalink: pretty
markdown: kramdown
timezone: Asia/Seoul

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  news:
    output: true
    permalink: /news/:year/:title/

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: news }
    values: { layout: page }

exclude:
  - CLAUDE.md
  - docs/
  - tools/
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .bundle/
